    /* --- Phase 1: Header Fade-In (0ms - 200ms) --- */
    @keyframes headerFadeIn {
      0% {
        opacity: 0;
        transform: translateY(-6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- Phase 1 & Continuous: Ambient Soft Bloom --- */
    @keyframes ambientBloomAwaken {
      0% {
        opacity: 0;
        transform: scale(0.65);
      }
      60% {
        opacity: 0.85;
        transform: scale(1.15);
      }
      100% {
        opacity: 0.6;
        transform: scale(1);
      }
    }

    /* Calibration wave pulse triggered upon tap */
    @keyframes coreTapWave {
      0% {
        transform: scale(1);
      }
      35% {
        transform: scale(1.06);
      }
      65% {
        transform: scale(0.97);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes ambientPulseGlow {
      0%, 100% {
        opacity: 0.55;
        transform: scale(1);
      }
      50% {
        opacity: 0.82;
        transform: scale(1.1);
      }
    }

    /* --- Phase 2: Concentric Hairline Orbital Rings --- */
    @keyframes outerOrbitalSpinLock {
      0% {
        opacity: 0;
        transform: rotate(-140deg) scale(0.82);
      }
      65% {
        opacity: 0.9;
        transform: rotate(12deg) scale(1.02);
      }
      100% {
        opacity: 0.7;
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes innerOrbitalSpinLock {
      0% {
        opacity: 0;
        transform: rotate(160deg) scale(0.85);
      }
      70% {
        opacity: 0.85;
        transform: rotate(-10deg) scale(1.02);
      }
      100% {
        opacity: 0.65;
        transform: rotate(0deg) scale(1);
      }
    }

    /* Calibration Ticks / Micro Dots Staggered Reveal */
    @keyframes tickPop {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      70% {
        opacity: 1;
        transform: scale(1.25);
      }
      100% {
        opacity: 0.7;
        transform: scale(1);
      }
    }

    /* Orbital Light Sweep Glide */
    @keyframes lightSweepA {
      0% {
        stroke-dashoffset: 140;
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      80% {
        stroke-dashoffset: 0;
        opacity: 0.95;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0.7;
      }
    }

    @keyframes lightSweepB {
      0% {
        stroke-dashoffset: 120;
        opacity: 0;
      }
      35% {
        opacity: 1;
      }
      85% {
        stroke-dashoffset: 0;
        opacity: 0.9;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0.6;
      }
    }

    /* Central Glass Core Scale Reveal + Energy Pulse */
    @keyframes glassCoreReveal {
      0% {
        opacity: 0;
        transform: scale(0.85);
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
      }
      60% {
        opacity: 1;
        transform: scale(1.04);
        box-shadow: 0 0 28px rgba(37, 99, 235, 0.4), 0 0 45px rgba(52, 211, 153, 0.25);
      }
      80% {
        transform: scale(0.99);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 16px 36px -6px rgba(11, 15, 25, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.9);
      }
    }

    /* Outward Ripple Ring from Glass Core */
    @keyframes coreEnergyPulseOut {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      45% {
        opacity: 0.6;
      }
      100% {
        opacity: 0;
        transform: scale(1.45);
      }
    }

    /* Badge & Verification Emblem Path Draw */
    @keyframes emblemBadgeDraw {
      0% {
        stroke-dashoffset: 160;
        opacity: 0;
        transform: scale(0.8) rotate(-15deg);
      }
      50% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Checkmark Draw Inside Badge */
    @keyframes checkmarkDraw {
      0% {
        stroke-dashoffset: 30;
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    /* Emerald-Cyan Accent Dot Pulse & Glow */
    @keyframes accentDotSettle {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      60% {
        opacity: 1;
        transform: scale(1.4);
        box-shadow: 0 0 16px rgba(52, 211, 153, 1), 0 0 24px rgba(37, 99, 235, 0.6);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.8), 0 0 14px rgba(37, 99, 235, 0.4);
      }

    @keyframes accentDotBreathing {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.9), 0 0 20px rgba(37, 99, 235, 0.5);
      }
    }

    /* --- Phase 3 & 4: Text Stagger Sequences --- */
    @keyframes textSlideUpHead {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textSlideUpSub {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- Phase 5: CTA Button Reveal & Shimmer Gleam --- */
    @keyframes ctaRevealUp {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonShimmerPass {
      0% {
        transform: translateX(-140%) skewX(-20deg);

      }
      20% {
        opacity: 0.65;
      }
      70% {
        opacity: 0.65;
      }
      100% {
        transform: translateX(180%) skewX(-20deg);
        opacity: 0;
      }
    }

    .anim-header {
      animation: headerFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0ms forwards;

    .anim-bloom {

    .anim-tick-4 { animation: tickPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.54s forwards; }

    .anim-glass-core {

    }

    .anim-core-wave {

    }

    .anim-emblem-badge {
      animation: emblemBadgeDraw 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
    }

    .anim-emblem-check {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: checkmarkDraw 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.62s forwards;
    }

    .anim-accent-dot {
      opacity: 0;
      animation: accentDotSettle 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.72s forwards,
                 accentDotBreathing 3.2s ease-in-out 1.2s infinite;
    }

    .anim-heading {
      opacity: 0;
      animation: textSlideUpHead 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.62s forwards;
    }

    .anim-subtext {
      opacity: 0;
      animation: textSlideUpSub 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.76s forwards;
    }

    .anim-cta-wrap {
      opacity: 0;
      animation: ctaRevealUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    }

    .anim-btn-shimmer {
      animation: buttonShimmerPass 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    .core-active-pulse {
      animation: coreTapWave 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Accessibility: Respect Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .anim-header, .anim-bloom, .anim-outer-orbit, .anim-inner-orbit, 
      .anim-glass-core, .anim-heading, .anim-subtext, .anim-cta-wrap, 
      .anim-accent-dot, .anim-emblem-badge, .anim-emblem-check {
        opacity: 1 !important;
        transform: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

<!-- Production-Grade Micro-Interactions Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const continueBtn = document.getElementById('continueBtn');
      const btnLabelWrap = document.getElementById('btnLabelWrap');
      const btnShimmer = document.getElementById('btnShimmer');
      const verificationCore = document.getElementById('verificationCore');
      const ambientBloom = document.getElementById('ambientBloom');
      const glassCoreBadge = document.getElementById('glassCoreBadge');
      const coreWaveRing = document.getElementById('coreWaveRing');

      // 1. Tapping / Clicking "Continue →" micro-interaction with spinner / progress state
      let isProceeding = false;
      if (continueBtn && btnLabelWrap) {
        continueBtn.addEventListener('click', (e) => {
          if (isProceeding) return;
          isProceeding = true;

          // Gentle active tactile sheen & pulse
          continueBtn.classList.add('brightness-110');

          // Smooth micro-spinner state
          btnLabelWrap.innerHTML = `
            <svg class="animate-spin h-[18px] w-[18px] text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3.5"></circle>
              <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="tracking-[-0.01em]">Proceeding...</span>
          `;

          // Transition to verified confirmation state
          setTimeout(() => {
            btnLabelWrap.innerHTML = `
              <span class="tracking-[-0.01em]">Done</span>
              <svg class="w-[18px] h-[18px] stroke-[2.4] stroke-[#34D399] fill-none animate-bounce" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            `;
            continueBtn.classList.remove('brightness-110');
            continueBtn.classList.add('bg-[#0B0F19]');
          }, 850);
        });
      }

      // 2. Interactive Verification Core Calibration Pulse:
      // Tapping the core triggers an elegant calibration pulse re-energizing orbital rings and ambient glow
      if (verificationCore) {
        verificationCore.addEventListener('click', () => {
          // Re-trigger core tap wave
          verificationCore.classList.remove('core-active-pulse');
          void verificationCore.offsetWidth; // trigger reflow
          verificationCore.classList.add('core-active-pulse');

          // Bloom boost effect
          if (ambientBloom) {
            ambientBloom.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
            ambientBloom.style.opacity = '1';
            ambientBloom.style.transform = 'scale(1.25)';
            setTimeout(() => {
              ambientBloom.style.opacity = '';
              ambientBloom.style.transform = '';
            }, 400);
          }

          // Outward energy ripple ring animation
          if (coreWaveRing) {
            coreWaveRing.style.animation = 'none';
            void coreWaveRing.offsetWidth;
            coreWaveRing.style.animation = 'coreEnergyPulseOut 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards';
          }
        });
      }
    });
  </script>
