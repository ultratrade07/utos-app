<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>UTOS - Sign In</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">

            "on-secondary-fixed-variant": "#003ea8",
            "surface-tint": "#5f5e5e",
            "surface-bright": "#f9f9ff",
            "on-background": "#151c27",
            "primary": "#000000",
            "primary-fixed-dim": "#c8c6c5",
            "on-secondary": "#ffffff",
            "inverse-on-surface": "#ebf1ff",
            "on-surface": "#151c27",
            "on-tertiary-container": "#009668",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#c4c7c7",
            "on-secondary-container": "#fefcff",
            "tertiary-fixed-dim": "#4edea3",
            "secondary": "#0051d5",
            "on-error-container": "#93000a",
            "tertiary": "#000000",
            "on-primary-fixed": "#1c1b1b",
            "secondary-container": "#316bf3",
            "outline": "#747878",
            "error-container": "#ffdad6",
            "primary-fixed": "#e5e2e1",
            "primary-container": "#1c1b1b",
            "on-primary-container": "#858383",
            "on-secondary-fixed": "#00174b",
            "inverse-surface": "#2a313d",
            "on-error": "#ffffff",
            "on-primary": "#ffffff",
            "on-tertiary-fixed-variant": "#005236",
            "on-surface-variant": "#444748",

          "borderRadius": {

      },
    }

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    input:focus {
      outline: none;
    }
    body {
      min-height: max(884px, 100dvh);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Avenir Next', Inter, sans-serif;
    }
    /* Hide scrollbars for clean presentation */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
</style>
</head>
<body class="bg-[#F7F8FA] min-h-[100dvh] w-full flex flex-col antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Mobile Viewport Canvas Container (390px x 844px) -->
<main class="w-full min-h-[100dvh] bg-[#F7F8FA] flex flex-col justify-between select-none">
<!-- Fixed Header Region: Status Bar & Generously Spaced Navigation Bar -->
<div class="w-full shrink-0 z-30 pt-4">
<!-- Top Safe Area: Native Status Bar with Dynamic Island -->

<!-- Top Navigation Bar: Moved down with generous breathing room (pt-5 / 20px) -->
<section class="flex items-center justify-between px-6 pt-5 pb-2 w-full max-w-md mx-auto">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-white border border-[#E5E7EB] flex items-center justify-center text-[#111827] shadow-sm hover:bg-slate-50 transition active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<!-- Center Minimal UTOS Wordmark / Brand Anchor -->
<div class="flex items-center space-x-2">
<div class="w-6 h-6 rounded-lg bg-black flex items-center justify-center text-white font-bold text-[12px] tracking-wider">
          U
        </div>
<span class="text-[17px] font-bold tracking-tight text-[#111827]">UTREVIA</span>
</div>
<!-- Invisible Balancer for true center alignment -->
<div class="w-10 h-10 opacity-0 pointer-events-none"></div>
</section>
</div>
<!-- Interactive Core: Scrollable & Padded Auth Form -->
<div class="flex-1 px-6 flex flex-col justify-start overflow-y-auto no-scrollbar">
<div class="w-full mx-auto pt-9 pb-2 flex flex-col justify-start max-w-md">
<!-- Screen Headline & Subtitle with intentional vertical presence -->
<div class="text-center mb-7">
<h1 class="text-[27px] font-semibold text-[#111827] tracking-[-0.025em] leading-[34px]">Welcome Back</h1>
<p class="text-[14px] font-normal text-[#6B7280] leading-[1.45] mt-2">Sign in to continue to your UTREVIA account.</p>
</div>
<!-- Social Login Buttons Pair -->
<div class="grid grid-cols-2 gap-3 mb-5">
<!-- Google Auth Button -->
<button class="h-[52px] bg-white border border-[#E5E7EB] rounded-2xl flex items-center justify-center space-x-2 shadow-sm hover:bg-slate-50 transition active:scale-[0.98]" type="button">
<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="text-[14.5px] font-medium text-[#1F2937]">Google</span>
</button>
<!-- Apple Auth Button -->
<button class="h-[52px] bg-white border border-[#E5E7EB] rounded-2xl flex items-center justify-center space-x-2 shadow-sm hover:bg-slate-50 transition active:scale-[0.98]" type="button">
<svg class="w-4 h-4 fill-current text-black shrink-0" viewBox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.78 1.06-1.85.94-2.94-.92.04-2.02.61-2.67 1.39-.58.67-1.09 1.76-.95 2.82 1.03.08 2.06-.52 2.68-1.27z"></path>
</svg>
<span class="text-[14.5px] font-medium text-[#1F2937]">Apple</span>
</button>
</div>
<!-- Divider: Subtle Line with Centered 'or' -->
<div class="relative flex items-center justify-center mb-[22px]">
<div class="w-full border-t border-[#E5E7EB]"></div>
<span class="absolute bg-[#F7F8FA] px-3 text-[13px] font-normal text-[#9CA3AF]">or</span>
</div>
<!-- Authentication Form -->
<form class="flex flex-col" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div class="mb-[18px]">
<label class="block text-[12.5px] font-medium text-[#374151] mb-2 ml-0.5" for="email-field">Email Address</label>
<div class="relative">
<input class="w-full h-[54px] px-4 bg-white border border-[#E5E7EB] rounded-2xl text-[15px] font-normal text-[#111827] placeholder:text-[#9CA3AF] transition-all duration-150 focus:border-[#2563EB] focus:ring-2 focus:ring-[#2563EB]/10" id="email-field" placeholder="name@example.com" type="email" value="sanjay.kushwaha@utos.com">
</div>
</div>
<!-- Password Input Field -->
<div>
<label class="block text-[12.5px] font-medium text-[#374151] mb-2 ml-0.5" for="password-field">Password</label>
<div class="relative flex items-center">
<input class="w-full h-[54px] pl-4 pr-12 bg-white border border-[#E5E7EB] rounded-2xl text-[15px] font-normal text-[#111827] placeholder:text-[#9CA3AF] transition-all duration-150 focus:border-[#2563EB] focus:ring-2 focus:ring-[#2563EB]/10 tracking-wider" id="password-field" placeholder="••••••••••••" type="password" value="FintechSecure2025">
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-[#6B7280] hover:text-[#111827] p-1.5 rounded-lg transition-colors flex items-center justify-center" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px] text-[#6B7280]" id="eye-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Secondary Actions Row: Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-4 mb-[22px] px-0.5">
<!-- Custom Toggle Switch -->
<label class="flex items-center space-x-2.5 cursor-pointer group">
<div class="relative">
<input checked="" class="sr-only peer" id="remember-me" type="checkbox">
<!-- Switch Track -->
<div class="w-10 h-6 bg-[#E5E7EB] peer-checked:bg-[#2563EB] rounded-full transition-colors duration-200"></div>
<!-- Switch Thumb -->
<div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 peer-checked:translate-x-4 shadow-sm"></div>
</div>
<span class="text-[13.5px] font-normal text-[#4B5563] group-hover:text-[#111827] transition-colors">Remember me</span>
</label>
<!-- Forgot Password Link -->
<a class="text-[13.5px] font-medium text-[#2563EB] hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<!-- Primary CTA Button -->
<div>
<button class="w-full h-[54px] bg-[#111111] text-white rounded-2xl text-[16px] font-semibold tracking-[-0.01em] flex items-center justify-center space-x-2 shadow-sm hover:bg-black active:scale-[0.985] transition-all duration-150" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
<!-- Action Anchor: Bottom Switcher & Home Safe Area Indicator -->
<footer class="w-full shrink-0 pt-3 pb-6 text-center flex flex-col items-center mt-auto">
<div class="mb-2 text-[13.5px] font-normal text-[#6B7280]">
      Don't have an account? 
      <a class="text-[#2563EB] font-medium hover:underline ml-1" href="#">Sign Up</a>
</div>
<!-- Native iPhone Home Bar Indicator -->

</footer>
</main>
<!-- Interactive Logic for Password Toggle & Fluid Feedback -->
<script>
    const passwordInput = document.getElementById('password-field');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    toggleButton.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
    });
</script>






</body></html>
