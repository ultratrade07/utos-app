<div class="w-full min-h-[884px] flex flex-col justify-between pt-safe px-margin-mobile pb-safe max-w-lg mx-auto">
<!-- Top Navigation Header (Shared Component: TopAppBar aligned) -->
<header class="flex items-center justify-between py-space-md w-full shrink-0">
<button aria-label="Go back" class="w-10 h-10 rounded-full border border-outline-variant/60 bg-surface-container-lowest flex items-center justify-center text-on-surface active:scale-95 transition-transform duration-150 hover:bg-surface-container-high focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
</button>

<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center text-on-primary font-headline-sm text-label-md font-bold tracking-tight">
          U
        </div>
<span class="text-headline-sm font-headline-sm font-bold text-on-background tracking-tight">
          UTOS
        </span>
</div>
<!-- Symmetrical spacer -->
<div aria-hidden="true" class="w-10 h-10"></div>
</header>
<!-- Main Content Area: Centered and Balanced Vertical Core -->
<main class="flex-1 flex flex-col justify-center items-center py-space-xl w-full">
<div class="w-full max-w-sm flex flex-col items-center">
<!-- Visual Security Recovery Badge -->
<div class="w-16 h-16 rounded-[20px] bg-secondary-fixed/50 border border-secondary-fixed flex items-center justify-center mb-6 relative">
<span class="material-symbols-outlined text-[30px] text-secondary" data-icon="mark_email_unread">mark_email_unread</span>
<span class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-surface-container-lowest border border-outline-variant/50 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[14px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
</span>
</div>
<!-- Title & Explanatory Narrative -->
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface text-center mb-2 tracking-tight">
          Forgot Password
        </h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center max-w-xs mb-8">
          Please enter your email address to reset your password.
        </p>
<!-- Form Submission Core -->
<form class="w-full space-y-5" onsubmit="event.preventDefault();">
<div class="w-full text-left">
<label class="block text-label-md font-label-md text-on-surface mb-2" for="email">
              Email Address
            </label>
<div class="relative flex items-center rounded-2xl border border-outline-variant/60 bg-surface-container-lowest px-4 h-14 shadow-sm transition-all duration-150 focus-within:border-secondary focus-within:ring-2 focus-within:ring-secondary/15">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant/70 mr-3 shrink-0 flex items-center justify-center" data-icon="mail">mail</span>
<input autocomplete="email" class="w-full bg-transparent border-0 p-0 text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:outline-none" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-14 rounded-full bg-primary hover:bg-primary-container active:scale-[0.985] text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 transition-all duration-150 cursor-pointer" type="submit">
<span class="">Send Reset Link</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Contextual Support Block -->
<div class="mt-8 text-center space-y-1">
<p class="text-body-sm font-body-sm text-on-surface-variant">
            Don't remember your email?
          </p>
<a class="inline-block text-label-md font-label-md text-secondary hover:underline transition-colors" href="mailto:support@utos.com">
            Contact us at support@utos.com
          </a>
</div>
</div>

<span class="material-symbols-outlined text-[16px] text-outline" data-icon="verified_user">verified_user</span>
