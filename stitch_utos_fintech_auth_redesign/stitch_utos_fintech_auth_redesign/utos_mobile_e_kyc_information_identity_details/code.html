<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>UTOS Mobile E-KYC Information - Personal Details</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Forms & Container Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            utos: {
              emerald: '#059669',
              mint: '#ECFDF5',
              dark: '#111827',
              amber: '#F59E0B',
              amberBg: '#FBBF24',
            },
          },
          boxShadow: {
            card: '0 10px 25px -5px rgba(5, 150, 105, 0.18)',
            soft: '0 4px 18px rgba(0, 0, 0, 0.04)',
            banner: '0 12px 30px -4px rgba(245, 158, 11, 0.25)',
          },
        },
      },
    };
  </script>
<!-- Custom Typography & Layout Utilities -->
<style data-purpose="typography">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style data-purpose="custom-elements">
    /* Subtle background glow effect replicating mint top gradient */
    .bg-top-glow {
      background: radial-gradient(circle at 50% 0%, #D1FAE5 0%, #ECFDF5 40%, #FAFAFA 100%);
    }
  </style>
</head>
<body class="bg-stone-50 text-gray-900 min-h-screen w-full flex flex-col bg-top-glow antialiased selection:bg-emerald-500 selection:text-white">
<!-- BEGIN: MainHeader -->
<header class="w-full pt-4 pb-3 px-5 sticky top-0 z-30 bg-transparent backdrop-blur-xs flex items-center justify-between" data-purpose="screen-header">
<!-- Back Circular Button -->
<button aria-label="Go Back" class="w-11 h-11 rounded-2xl bg-white border border-gray-100 shadow-soft flex items-center justify-center text-gray-700 hover:text-emerald-700 active:scale-95 transition-all duration-150" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7"></path>
</svg>
</button>
<!-- UTOS Brand Center Monogram & Title -->
<div class="flex items-center gap-2" data-purpose="brand-monogram">
<div class="w-8 h-8 rounded-full bg-gray-900 flex items-center justify-center text-white font-extrabold text-sm tracking-tight shadow-sm">
        U
      </div>
<span class="font-bold text-gray-900 text-lg tracking-tight">UTOS</span>
</div>
<!-- Empty balanced spacer to keep header centered -->
<div aria-hidden="true" class="w-11 h-11"></div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 w-full max-w-md mx-auto px-5 pb-6 flex flex-col space-y-6" data-purpose="kyc-step-content">
<!-- Page Context Title -->
<div class="pt-1 flex items-center justify-between">
<h1 class="text-xl font-bold text-gray-900 tracking-tight">E - KYC Information</h1>
<span class="text-xs font-semibold text-emerald-800 bg-emerald-100/90 px-2.5 py-1 rounded-full">Step 2 of 3</span>
</div>
<!-- BEGIN: HeroCard -->
<!-- Current Step Emerald Hero Container -->
<section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-600 via-emerald-600 to-teal-700 text-white p-6 shadow-card" data-purpose="current-step-hero">
<!-- Background Ambient Glow Rings -->
<div aria-hidden="true" class="absolute -right-6 -bottom-8 w-44 h-44 rounded-full bg-white/5 pointer-events-none"></div>
<div aria-hidden="true" class="absolute -right-12 -bottom-14 w-60 h-60 rounded-full border border-white/10 pointer-events-none"></div>
<div class="relative z-10 flex items-center justify-between gap-4">
<!-- Text & Stepper Dot Details -->
<div class="space-y-1.5 flex-1 pr-2">
<h2 class="text-2xl font-bold tracking-tight text-white">Identity Details</h2>
<p class="text-xs sm:text-sm text-emerald-50 leading-relaxed font-normal">Enter your details exactly as shown on your official documents.</p>
<!-- Stepper Indicator Dots -->
<div aria-label="Step progress" class="flex items-center gap-1.5 pt-3"><span class="w-2 h-2 rounded-full bg-white/40" title="Step 1: Completed"></span>
<span class="w-5 h-2 rounded-full bg-amber-300 shadow-sm" title="Step 2: Active"></span>
<span class="w-2 h-2 rounded-full bg-white/40" title="Step 3: Inactive"></span></div>
</div>
<!-- Concentric Circular Profile Badge -->
<div class="shrink-0 relative flex items-center justify-center" data-purpose="avatar-badge">
<!-- Outer Halo Ring -->
<div class="w-20 h-20 rounded-full bg-white/15 flex items-center justify-center p-1.5 ring-1 ring-white/20">
<!-- Middle Layer Ring -->
<div class="w-full h-full rounded-full bg-emerald-500/40 flex items-center justify-center">
<!-- Inner Core Circle with Avatar Icon -->
<div class="w-12 h-12 rounded-full bg-emerald-500/80 shadow-inner flex items-center justify-center text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24"><rect height="14" rx="2" width="18" x="3" y="5"></rect><circle cx="9" cy="11" r="2"></circle><path d="M15 9h2M15 13h2M6 16c0-1.5 1.5-2 3-2s3 .5 3 2"></path></svg></div>
</div>
</div>
<!-- Accent Status Pip -->
<span class="absolute top-1.5 right-1.5 w-3 h-3 bg-amber-400 border-2 border-emerald-700 rounded-full shadow-sm"></span>
</div>
</div>
</section>
<!-- END: HeroCard -->
<!-- BEGIN: KYCForm -->
<!-- Form Inputs with Exactly 3 Required Fields -->
<form class="space-y-4 pt-1 flex-1" data-purpose="personal-details-form" onsubmit="event.preventDefault();"><!-- Field 1: Full Name as per Aadhaar -->
<div class="space-y-1.5" data-purpose="form-group-aadhaar-name">
<label class="block text-sm font-semibold text-gray-800" for="aadhaarName">
    Full Name as per Aadhaar <span class="text-rose-500">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-white rounded-2xl border border-gray-200 text-gray-900 placeholder:text-gray-400 font-medium text-base focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 shadow-soft transition-all duration-150" id="aadhaarName" name="aadhaarName" placeholder="Enter your full name as on Aadhaar" required="" type="text" value="">
</div>
</div><!-- Field: Father's Name -->
<div class="space-y-1.5" data-purpose="form-group-father-name">
<label class="block text-sm font-semibold text-gray-800" for="fatherName">
    Father's Name <span class="text-rose-500">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-white rounded-2xl border border-gray-200 text-gray-900 placeholder:text-gray-400 font-medium text-base focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 shadow-soft transition-all duration-150" id="fatherName" name="fatherName" placeholder="Enter your father's full name" required="" type="text" value="">
</div>
</div>
<!-- Field 2: Aadhaar Number -->
<div class="space-y-1.5" data-purpose="form-group-aadhaar-number">
<label class="block text-sm font-semibold text-gray-800" for="aadhaarNumber">
    Aadhaar Number <span class="text-rose-500">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="14" rx="2" width="18" x="3" y="5"></rect>
<circle cx="8" cy="11" r="1.5"></circle>
<path d="M13 10h4M13 13h3"></path>
</svg>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-white rounded-2xl border border-gray-200 text-gray-900 placeholder:text-gray-400 font-medium text-base focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 shadow-soft transition-all duration-150" id="aadhaarNumber" maxlength="14" name="aadhaarNumber" placeholder="Enter your 12-digit Aadhaar number" required="" type="tel">
</div>
</div>
<!-- Field 3: PAN Number -->
<div class="space-y-1.5" data-purpose="form-group-pan-number">
<label class="block text-sm font-semibold text-gray-800" for="panNumber">
    PAN Number <span class="text-rose-500">*</span>
</label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<rect height="14" rx="2" width="20" x="2" y="5"></rect>
<line x1="2" x2="22" y1="10" y2="10"></line>
</svg>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-white rounded-2xl border border-gray-200 text-gray-900 placeholder:text-gray-400 font-medium text-base uppercase focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 shadow-soft transition-all duration-150" id="panNumber" maxlength="10" name="panNumber" placeholder="Enter your PAN number" required="" type="text">
</div>
</div></form>
<!-- END: KYCForm -->
<!-- BEGIN: NoticeAndAction -->
<!-- Bottom Warm Amber Information Card & Action Button -->
<section class="mt-auto rounded-3xl bg-gradient-to-b from-amber-400 to-amber-500 p-5 shadow-banner flex flex-col gap-4 text-gray-950" data-purpose="bottom-notice-card">
<!-- Disclaimer notice matching the reference layout style -->
<div class="flex items-start gap-3">
<div class="w-7 h-7 rounded-xl bg-amber-600/30 flex items-center justify-center shrink-0 mt-0.5 text-amber-950">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<p class="text-xs sm:text-sm font-medium leading-relaxed text-amber-950">Make sure your name and ID details match your official documents.</p>
</div>
<!-- Primary Action CTA Button -->
<button class="w-full h-14 bg-gray-900 hover:bg-black text-white font-semibold text-base rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition-all duration-150" data-purpose="primary-continue-action" id="continueBtn" type="button">
<span class="">Continue</span>
<svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M5 12h14M12 5l7 7-7 7"></path>
</svg>
</button>
</section>
<!-- END: NoticeAndAction -->
</main>
<!-- END: MainContent -->
<!-- Interactive UX feedback script -->
<script data-purpose="interaction-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const continueBtn = document.getElementById('continueBtn');
      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          // Provide interactive feedback
          continueBtn.classList.add('opacity-90');
          setTimeout(() => {
            continueBtn.classList.remove('opacity-90');
          }, 150);
        });
      }
    });
  </script>


</body></html>
