<script>
    // Lightweight radio toggle interaction for tactile feedback
    const uploadLabels = document.querySelectorAll('label[for^="take-photo"], label[for^="upload-gallery"]');
    uploadLabels.forEach(label => {
      label.addEventListener('click', () => {
        uploadLabels.forEach(l => {
          l.classList.remove('border-2', 'border-emerald-500/80');
          l.classList.add('border', 'border-outline-variant/50');
          const indicator = l.querySelector('.rounded-full.border-2');
          if (indicator) {
            indicator.className = 'w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center p-0.5 ml-2';
            indicator.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>';
          }
        });
        label.classList.remove('border', 'border-outline-variant/50');
        label.classList.add('border-2', 'border-emerald-500/80');
        const activeIndicator = label.querySelector('.rounded-full.border-2');
        if (activeIndicator) {
          activeIndicator.className = 'w-5 h-5 rounded-full border-2 border-emerald-600 flex items-center justify-center p-0.5 ml-2';
          activeIndicator.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-emerald-600"></div>';
        }
      });
    });
  </script>
